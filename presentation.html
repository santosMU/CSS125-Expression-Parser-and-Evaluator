<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expression Parser</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, sans-serif;
    }

    button,
    select,
    textarea {
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 30px auto;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 26px;
    }

    .description {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    .pipeline {
      display: flex;
      gap: 6px;
      margin: 20px 0;
    }

    .stage {
      flex: 1;
      padding: 9px;
      background: white;
      border: 1px solid #ccc;
      font-size: 12px;
      color: #666;
    }

    .stage b {
      display: block;
      margin-top: 4px;
      color: #222;
      font-weight: normal;
    }

    .stage.done {
      background: #edf7f4;
      border-color: #8bb8aa;
    }

    .stage.failed {
      background: #fff0f0;
      border-color: #d99;
    }

    .content {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }

    .left,
    .right {
      background: white;
      border: 1px solid #ccc;
    }

    .left {
      width: 42%;
      padding: 15px;
    }

    .right {
      width: 58%;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: bold;
    }

    .example-row {
      display: flex;
      gap: 7px;
    }

    select {
      flex: 1;
      min-width: 0;
      padding: 7px;
      background: white;
      color: #222;
      border: 1px solid #bbb;
    }

    button {
      padding: 7px 10px;
      background: #f1f1f1;
      color: #222;
      border: 1px solid #bbb;
      cursor: pointer;
    }

    button:hover {
      background: #e7e7e7;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .lesson {
      min-height: 48px;
      color: #555;
      font-size: 13px;
      line-height: 1.4;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 12px;
      color: #444;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 10px;
      resize: vertical;
      background: #fafafa;
      color: #111;
      border: 1px solid #bbb;
      font-family: Consolas, monospace;
      font-size: 16px;
    }

    #run {
      width: 100%;
      margin-top: 10px;
      background: #dbeafe;
      border-color: #9dbbe5;
      color: #163a67;
      font-weight: bold;
    }

    #run:hover {
      background: #cfe2fb;
    }

    .hint {
      margin-top: 7px;
      color: #777;
      font-size: 11px;
    }

    .result-box {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    #status {
      color: #777;
    }

    #result {
      margin-bottom: 0;
      color: #245a44;
      white-space: pre-wrap;
      font-family: Consolas, monospace;
      font-size: 21px;
    }

    #result.error {
      color: #a33;
      font-size: 13px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #ccc;
    }

    .tabs button {
      border: 0;
      border-right: 1px solid #ccc;
      background: #f7f7f7;
      font-size: 12px;
    }

    .tabs button[aria-selected="true"] {
      background: #dbeafe;
    }

    #pane {
      margin: 0;
      padding: 14px;
      min-height: 430px;
      max-height: 560px;
      overflow: auto;
      white-space: pre;
      color: #222;
      font-family: Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 800px) {
      .pipeline {
        flex-wrap: wrap;
      }

      .stage {
        min-width: 45%;
      }

      .content {
        display: block;
      }

      .left,
      .right {
        width: 100%;
      }

      .right {
        margin-top: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Expression Parser and Evaluator</h1>
    <p class="description">
      Enter an expression and check what happens in each stage.
    </p>

    <div class="pipeline" aria-label="Processing stages">
      <div class="stage" data-stage="tokens">
        01
        <b>Lexical analysis</b>
      </div>

      <div class="stage" data-stage="ast">
        02
        <b>Parsing</b>
      </div>

      <div class="stage" data-stage="semantics">
        03
        <b>Semantic analysis</b>
      </div>

      <div class="stage" data-stage="trace">
        04
        <b>Evaluation</b>
      </div>

      <div class="stage" data-stage="output">
        05
        <b>Output</b>
      </div>
    </div>

    <div class="content">
      <section class="left">
        <p class="section-title">Expression</p>

        <div class="example-row">
          <select id="examples" aria-label="Example expression"></select>
          <button id="next">Next</button>
        </div>

        <p class="lesson" id="lesson"></p>

        <label for="source">Source expression</label>
        <textarea
          id="source"
          spellcheck="false"
          maxlength="10000"
          aria-describedby="shortcut"
        ></textarea>

        <button id="run">Evaluate</button>

        <div class="hint" id="shortcut">
          Ctrl + Enter also runs the expression
        </div>

        <div class="result-box" aria-live="polite">
          <div class="result-header">
            <span>Result</span>
            <span id="status">Ready</span>
          </div>

          <pre id="result">-</pre>
        </div>
      </section>

      <section class="right">
        <div class="tabs" role="tablist" aria-label="Processing details">
          <button role="tab" aria-selected="true" data-tab="tokens">Tokens</button>
          <button role="tab" aria-selected="false" data-tab="ast">Syntax tree</button>
          <button role="tab" aria-selected="false" data-tab="semantics">Semantics</button>
          <button role="tab" aria-selected="false" data-tab="trace">Evaluation</button>
          <button role="tab" aria-selected="false" data-tab="report">Full report</button>
        </div>

        <pre id="pane" role="tabpanel" tabindex="0"></pre>
      </section>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    let examples = [];
    let report = {};
    let active = 'tokens';
    let revision = 0;

    function showTab(key) {
      active = key;

      document.querySelectorAll('[data-tab]').forEach(button => {
        const selected = button.dataset.tab === key;
        button.setAttribute('aria-selected', String(selected));
      });

      $('pane').textContent = report[key] ||
        'This stage has not completed. See the full report for details.';
    }

    function clearStages() {
      document.querySelectorAll('[data-stage]').forEach(stage => {
        stage.className = 'stage';
      });
    }

    function changed() {
      revision++;
      report = {};

      clearStages();

      $('status').textContent = 'Input changed';
      $('result').textContent = 'Run to update';
      $('result').className = '';
      $('pane').textContent =
        'Evaluate the current expression to see its processing stages.';
    }

    async function evaluate() {
      const current = ++revision;

      $('run').disabled = true;
      $('status').textContent = 'Evaluating...';

      try {
        const response = await fetch('/api/evaluate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            source: $('source').value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Request failed');
        }

        if (current !== revision) {
          return;
        }

        report = data;
        clearStages();

        document.querySelectorAll('[data-stage]').forEach(stage => {
          if (data[stage.dataset.stage]) {
            stage.classList.add('done');
          }
        });

        if (data.error) {
          const stageNames = {
            Lexical: 'tokens',
            Syntax: 'ast',
            Semantic: 'semantics',
            Runtime: 'trace'
          };

          const failedStage = stageNames[data.stage];
          const failedElement = document.querySelector(
            `[data-stage="${failedStage}"]`
          );

          if (failedElement) {
            failedElement.className = 'stage failed';
          }

          $('result').textContent = data.error;
          $('result').className = 'error';
          $('status').textContent = data.stage + ' error';

          showTab('report');
        } else {
          $('result').textContent = data.output;
          $('result').className = '';
          $('status').textContent = 'Evaluation complete';

          showTab(active);
        }
      } catch (error) {
        if (current !== revision) {
          return;
        }

        report = {};
        clearStages();

        $('result').textContent =
          'Could not evaluate: ' + error.message +
          '\nKeep the Python presentation server running.';

        $('result').className = 'error';
        $('status').textContent = 'Connection error';
        $('pane').textContent = 'No result available.';
      } finally {
        $('run').disabled = false;
      }
    }

    function loadExample() {
      const index = $('examples').selectedIndex;
      const item = examples[index];

      if (!item) {
        return;
      }

      $('source').value = item.source;
      $('lesson').textContent = item.lesson;

      changed();
      evaluate();
    }

    $('source').addEventListener('input', () => {
      changed();
      $('lesson').textContent =
        'Custom expression. Check how your changes affect each stage.';
    });

    $('source').addEventListener('keydown', event => {
      if (event.ctrlKey && event.key === 'Enter') {
        event.preventDefault();
        evaluate();
      }
    });

    $('run').addEventListener('click', evaluate);
    $('examples').addEventListener('change', loadExample);

    $('next').addEventListener('click', () => {
      if (examples.length === 0) {
        return;
      }

      $('examples').selectedIndex =
        ($('examples').selectedIndex + 1) % examples.length;

      loadExample();
    });

    document.querySelectorAll('[data-tab]').forEach(button => {
      button.addEventListener('click', () => {
        showTab(button.dataset.tab);
      });
    });

    fetch('/api/examples')
      .then(response => {
        if (!response.ok) {
          throw new Error('Example request failed');
        }

        return response.json();
      })
      .then(data => {
        examples = data;

        examples.forEach((example, index) => {
          const option = document.createElement('option');
          option.textContent = (index + 1) + '. ' + example.title;
          $('examples').append(option);
        });

        loadExample();
      })
      .catch(() => {
        $('status').textContent = 'Connection error';
        $('result').textContent =
          'Start the Python presentation server and reload the page.';
      });
  </script>
</body>
</html>
